<!doctype html>
<html lang="nl">
<head>

  <title>Cookie Clicker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1 class="game-title">KFC clickers 🍗</h1>

<div class="cookie-section">
  <div id="cookieButton" class="cookie-button" onclick="game.chicken_click()">🍗</div>
  <p id="cookieCounter" class="cookie-counter">0 koekjes</p>
  <p id="cookiePerSecond" class="cookie-cps">0 per seconde</p>

<div class="shop-section">
  <h2 class="shop-title">Winkel</h2>
  <div id="shopItems" class="shop-items"></div>
</div>

<div class="inventory-section">
  <h2 class="inventory-title">Mijn Producten</h2>
  <ul id="inventoryList" class="inventory-list"></ul>
</div>

<script src="js/main.js"></script>
</body>
</html>
