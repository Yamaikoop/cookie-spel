<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Cookie Clicker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1 class="game-title">KFC clickers 🍗</h1>

<div class="section">
  <div id="Button1" class="cookie-button" onclick="game.chicken_click()">🍗</div>
  <p id="Counter" class="cookie-counter">0 koekjes</p>
  <p id="PerSecond" class="cookie-cps">0 per seconde</p>
  <p id="button2" class="Upgrades" > per seconde</p>1
</div>

<div class="Upgrades">
  <h2 class="Upgrades">Upgrades</h2>
  <div id="upgrades" class="Upgrades"></div>
  <button class="Upgrades" id="button3" onclick="game.upgrade_click_power()">+1 hotwing per click (kosten: 10)</button>
  <button Class="Upgrades" id="button4" onclick="game.upgrade_click_power2()"> +5 hotwings per click (kosten 50) </button>
  <button Class="Upgrades" id="upgrade3"> +10 hotwings per click (kosten 100)</button>
</div>

<div class="inventory-section">
  <h2 class="inventory-title"></h2>
  <ul id="inventoryList" class="inventory-list"></ul>
</div>

<script src="js/main.js"></script>
</body>
</html>
