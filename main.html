<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Cookie Clicker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 30px;
      background: #fdf6e3;
      overflow-x: hidden;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }
    #cookie {
      width: 200px;
      cursor: pointer;
      transition: transform 0.1s ease;
      position: relative;
    }
    #cookie:active {
      transform: scale(0.9);
    }
    #counter {
      font-size: 1.5rem;
      margin: 20px 0;
    }
    #shop, #inventory {
      margin-top: 30px;
    }
    .upgrade {
      border: 2px solid #444;
      border-radius: 10px;
      padding: 10px;
      margin: 10px auto;
      width: 320px;
      background: #fff;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .upgrade:hover {
      background: #e0f7fa;
      transform: scale(1.05);
    }
    #inventoryList {
      list-style: none;
      padding: 0;
      max-width: 350px;
      margin: 0 auto;
      text-align: left;
    }
    #inventoryList li {
      background: #fff;
      border: 1px solid #ccc;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
    }
    .floating {
      position: absolute;
      font-size: 20px;
      animation: floatUp 1s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-100px); }
    }
  </style>
</head>
<body>
<h1>🍪 Cookie Clicker</h1>
<div style="position: relative; display: inline-block;">
  <img id="cookie" src="cookie.png" alt="cookie">
</div>
<div id="counter">Cookies: 0</div>

<h2>🛒 Winkel</h2>
<div id="shop">
  <!-- Handmatige upgrades -->
  <div class="upgrade" id="upgrade1">+1 cookie per klik (kosten: 10)</div>
  <div class="upgrade" id="upgrade2">+5 cookies per klik (kosten: 50)</div>
  <div class="upgrade" id="upgrade3">+10 cookies per klik (kosten: 200)</div>
  <!-- Automatische clickers -->
  <div class="upgrade" id="auto1">Automatische klikker (+1/s, kosten: 100)</div>
  <div class="upgrade" id="auto2">Oma (+5 cp prijs: 500🍪)</div>
  <div class="upgrade" id="auto3">Oven (+20 cp, prijs: 2000🍪)</div>
</div>

<h2>📦 Jouw producten</h2>
<ul id="inventoryList">
  <li>Nog geen producten gekocht</li>
</ul>

<script>

</script>
</body>
</html>

</body>
</html>
